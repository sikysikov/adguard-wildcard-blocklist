name: Build wildcard blocklist

on:
  schedule:
    # 04:17 UTC — deliberately off the hour, GitHub's scheduler is congested
    # on round times and delays runs queued there.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Invoked through bash rather than ./convert.sh: the repository is
      # authored on Windows, where the executable bit is not tracked.
      - name: Convert
        run: bash convert.sh

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain adguard-wildcard.txt)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          entries="$(grep -c '^[^#]' adguard-wildcard.txt)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adguard-wildcard.txt
          git commit -m "Update blocklist: $entries entries"
          git push
